<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') location.replace('https://' + location.host + location.pathname + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKI Report</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKI Report">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1B1B">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --red:#990000; --accent:#E0242A; --char:#1E1B1B; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  html { background:var(--char); }
  body {
    min-height:100vh; min-height:100dvh;
    color:#fff;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.0225) 0 18px, transparent 18px 32.53px),
      linear-gradient(180deg, var(--char) 0%, #3A1414 45%, var(--red) 100%);
    font-family:"Barlow Condensed", "Arial Narrow", sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: max(96px, calc(env(safe-area-inset-top) + 56px)) 28px calc(env(safe-area-inset-bottom) + 44px);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .top, .bottom { width:100%; max-width:420px; }
  .logo { width:150px; height:auto; display:block; margin-bottom:64px; }
  .tag {
    display:inline-flex; align-items:center; gap:10px;
    background:rgba(0,0,0,.32); border-radius:6px; padding:7px 14px 7px 12px;
    font-weight:700; font-size:18px; letter-spacing:.10em; color:rgba(255,255,255,.9);
    margin-bottom:28px;
  }
  .tag::before { content:""; width:4px; height:16px; border-radius:2px; background:var(--accent); }
  .weekday { font-weight:700; font-size:32px; letter-spacing:.14em; color:rgba(255,255,255,.7); line-height:1.15; margin:0 0 4px; }
  .date { font-weight:800; font-size:60px; line-height:.9; margin:0; white-space:nowrap; }
  .start {
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; padding:22px 20px; border-radius:12px;
    background:#fff; color:var(--red); text-decoration:none;
    font-weight:700; font-size:24px; letter-spacing:.04em;
    box-shadow:0 8px 24px rgba(0,0,0,.22); white-space:nowrap;
  }
  .start:active { transform:translateY(1px); background:#f4e8e8; }
  .start svg { width:22px; height:22px; flex:none; }
  .hint {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:14px; line-height:1.45; color:rgba(255,255,255,.72); margin:14px 0 0;
  }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" src="logo-white.svg" alt="MKI LLC">
    <div class="tag">END OF DAY REPORT</div>
    <p class="weekday" id="weekday"></p>
    <p class="date" id="date"></p>
  </div>
  <div class="bottom">
    <a class="start" id="start" href="#" target="_blank" rel="noopener">START TODAY'S REPORT
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#990000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <p class="hint">Takes about 3 minutes. Tap the microphone on your keyboard to talk instead of typing.</p>
  </div>
<script>
  var FORM_URL = "https://forms.cloud.microsoft/r/P6t05bFAV2";
  document.getElementById('start').href = FORM_URL;
  function showDate() {
    var d = new Date();
    document.getElementById('weekday').textContent = d.toLocaleDateString('en-US', { weekday:'long' }).toUpperCase();
    document.getElementById('date').textContent = d.toLocaleDateString('en-US', { month:'long', day:'numeric' }).toUpperCase();
  }
  showDate();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) showDate(); });
</script>
</body>
</html>
